<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#00c6c9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00c6c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="url(#bg)"/>

  <!-- glow sutil detrás del nombre -->
  <circle cx="600" cy="140" r="220" fill="url(#glow)" filter="url(#soft)"/>

  <!-- borde superior sutil -->
  <rect x="0" y="0" width="1200" height="1" fill="#161616"/>
  <rect x="0" y="279" width="1200" height="1" fill="#161616"/>

  <!-- tag superior izquierdo -->
  <text x="60" y="48" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11"
        font-weight="700" letter-spacing="4" fill="#8f8f8f">PERFIL · JAPEREZ-L001</text>
  <circle cx="226" cy="44.5" r="3" fill="#34d399"/>

  <!-- marca geométrica propia (diamante + acento) -->
  <g transform="translate(120,140)">
    <rect x="-26" y="-26" width="52" height="52" rx="8"
          transform="rotate(45)" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <rect x="-7" y="-7" width="14" height="14" rx="3"
          transform="rotate(45)" fill="#f6922e"/>
  </g>

  <!-- nombre -->
  <text x="600" y="128" text-anchor="middle"
        font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="46" font-weight="700"
        fill="#f8f8f8">Josué Pérez López</text>

  <!-- rol -->
  <text x="600" y="162" text-anchor="middle"
        font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="15" font-weight="700"
        letter-spacing="6" fill="#34d399">BACKEND DEVELOPER</text>

  <!-- divisor -->
  <rect x="520" y="182" width="160" height="1.5" fill="#00c6c9" opacity="0.5"/>

  <!-- stack corto -->
  <text x="600" y="206" text-anchor="middle"
        font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="600"
        letter-spacing="3" fill="#8f8f8f">.NET · PYTHON · SEGURIDAD · IA APLICADA</text>

</svg>
